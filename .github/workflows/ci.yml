name: Blocks and Oracle round trips
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: 67108864
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo test --locked --workspace --features oracle-text
      - run: python3 -m unittest discover -s tools
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: web/build.sh
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:all -- "$PWD/build/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-blocks-html
          path: build/index.html
