[package]
name = "oracle-blocks-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
oracle-text = ["dep:oracle-ir-grammar"]

[dependencies]
oracle-ir-grammar = { version = "=0.2.11", default-features = false, features = ["embedded-grammar"], optional = true }
oracle-ir-contract = { version = "=0.2.3", default-features = false }
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
wasm-bindgen = "=0.2.127"
